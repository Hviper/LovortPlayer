name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application (.app)
        run: |
          xcodebuild clean build \
            -project LovortPlayer.xcodeproj \
            -scheme LovortPlayer \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/LovortPlayer.app Payload/
          zip -r LovortPlayer.ipa Payload
          echo "IPA packaging completed successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LovortPlayer-IPA
          path: LovortPlayer.ipa
          retention-days: 7
