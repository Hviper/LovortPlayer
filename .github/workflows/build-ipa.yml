name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Restore Swift Package Sources
        id: packages-cache
        uses: actions/cache/restore@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-xcode26-${{ hashFiles('Package.resolved') }}

      - name: Resolve Swift Packages
        run: |
          mkdir -p LovortPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved LovortPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies \
            -project LovortPlayer.xcodeproj \
            -scheme LovortPlayer \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Cache Resolved Swift Package Sources
        if: steps.packages-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-xcode26-${{ hashFiles('Package.resolved') }}

      - name: Run iOS Core Tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project LovortPlayer.xcodeproj \
            -scheme LovortPlayer \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/TestDerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO

      - name: Build Application (.app)
        run: |
          xcodebuild clean build \
            -project LovortPlayer.xcodeproj \
            -scheme LovortPlayer \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_SWIFT_SYMBOLS=YES \
            DEPLOYMENT_POSTPROCESSING=YES \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/LovortPlayer.app Payload/
          zip -r LovortPlayer.ipa Payload
          # 打包 dSYM 供崩溃符号化
          zip -r LovortPlayer.dSYM.zip build/DerivedData/Build/Products/Release-iphoneos/LovortPlayer.app.dSYM 2>/dev/null || true
          echo "IPA size: $(du -sh LovortPlayer.ipa | cut -f1)"
          echo "IPA packaging completed successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LovortPlayer-IPA
          path: LovortPlayer.ipa
          retention-days: 7

      - name: Upload dSYM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LovortPlayer-dSYM
          path: LovortPlayer.dSYM.zip
          retention-days: 7

  release:
    name: Publish Latest Release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: LovortPlayer-IPA

      - name: Auto Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LovortPlayer Latest Build"
          files: LovortPlayer.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
