name: "LovortPlayer"
options:
  bundleIdPrefix: "com.hviper"
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "18.0"
packages:
  whisperkit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: "1.1.1"
  ksplayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: "2.3.4"
targets:
  LovortPlayer:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: Core
      - path: Views
    dependencies:
      - package: whisperkit
        product: WhisperKit
      - package: ksplayer
        product: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.hviper.lovortplayer"
        INFOPLIST_FILE: "App/Info.plist"
        CODE_SIGN_STYLE: "Automatic"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
