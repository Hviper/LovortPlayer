name: LovortPlayer
options:
  bundleIdPrefix: com.hviper
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "18.0"
packages:
  whisperkit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: "1.1.1"
  ksplayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: "2.3.4"
  zipfoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: "0.9.20"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  LovortPlayerCore:
    type: framework
    platform: iOS
    sources: [Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hviper.lovortplayer.core
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: whisperkit
        product: WhisperKit
      - package: ksplayer
        product: KSPlayer
      - package: zipfoundation
        product: ZIPFoundation
  LovortPlayer:
    type: application
    platform: iOS
    sources: [App, Views]
    dependencies:
      - target: LovortPlayerCore
      - package: ksplayer
        product: KSPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hviper.lovortplayer
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
  LovortPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LovortPlayerCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LovortPlayer:
    build:
      targets:
        LovortPlayer: all
        LovortPlayerTests: [test]
    test:
      targets: [LovortPlayerTests]
