name: "LovortPlayer"
options:
  bundleIdPrefix: "com.hviper"
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
packages:
  libdav1d:
    url: https://github.com/SDWebImage/libdav1d-Xcode.git
    exact: "1.1.0"
  whisperkit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exact: "1.1.1"
targets:
  LovortPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Views
    dependencies:
      - package: libdav1d
        product: libdav1d
      - package: whisperkit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.hviper.lovortplayer"
        INFOPLIST_FILE: "App/Info.plist"
        CODE_SIGN_STYLE: "Automatic"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
